name: Coverage

on:
  push:
    branches: [ main, master, macOS ]
  pull_request:
    branches: [ main, master ]

jobs:
  coverage:
    name: Code coverage (Linux/GCC)
    runs-on: ubuntu-24.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            pkg-config \
            ninja-build \
            lcov \
            xvfb

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure CMake
        working-directory: imgui-platform-kit
        run: |
          cmake -S . -B build/coverage \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_BUILD_TYPE=Debug \
            -DIMGUI_PLATFORM_KIT_COVERAGE=ON

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build
        working-directory: imgui-platform-kit
        run: cmake --build build/coverage --parallel

      - name: Run tests
        working-directory: imgui-platform-kit/build/coverage
        run: xvfb-run -a ctest --output-on-failure

      - name: Collect coverage
        working-directory: imgui-platform-kit/build/coverage
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info \
               '/usr/*' \
               '*/vcpkg_installed/*' \
               '*/tests/*' \
               '*/examples/*' \
               '*/stb_image.h' \
               --output-file coverage.info \
               --ignore-errors unused
          lcov --list coverage.info

      - name: Upload to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v4
        with:
          files: imgui-platform-kit/build/coverage/coverage.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
