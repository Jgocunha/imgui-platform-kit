name: Linux Build

on:
  push:
    branches: [ main, master, macOS ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-24.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            pkg-config \
            ninja-build

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure CMake
        working-directory: imgui-platform-kit
        run: |
          cmake -S . -B build/linux-ci \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_BUILD_TYPE=Release

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build
        working-directory: imgui-platform-kit
        run: cmake --build build/linux-ci --config Release --parallel

      - name: Run tests
        working-directory: imgui-platform-kit/build/linux-ci
        run: ctest --output-on-failure --build-config Release
