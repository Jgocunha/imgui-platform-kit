name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build and package (Windows)
    runs-on: windows-2025-vs2026

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize paths for bash
        shell: bash
        run: |
          echo "VCPKG_ROOT=$(echo "$VCPKG_ROOT" | tr '\\' '/')" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$(echo "$VCPKG_DEFAULT_BINARY_CACHE" | tr '\\' '/')" >> "$GITHUB_ENV"

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows

      - name: Configure CMake
        working-directory: imgui-platform-kit
        run: |
          cmake -S . -B build/release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build
        working-directory: imgui-platform-kit
        run: cmake --build build/release --config Release --parallel

      - name: Run tests
        working-directory: imgui-platform-kit/build/release
        run: ctest --output-on-failure --build-config Release

      - name: Install
        working-directory: imgui-platform-kit
        run: cmake --install build/release --config Release

      - name: Set version
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Package
        run: Compress-Archive -Path install -DestinationPath "imgui-platform-kit-${{ env.VERSION }}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgui-platform-kit-windows
          path: imgui-platform-kit-${{ env.VERSION }}-windows-x64.zip

  build-linux:
    name: Build and package (Linux)
    runs-on: ubuntu-24.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            ninja-build

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure CMake
        working-directory: imgui-platform-kit
        run: |
          cmake -S . -B build/release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build
        working-directory: imgui-platform-kit
        run: cmake --build build/release --config Release --parallel

      - name: Run tests
        working-directory: imgui-platform-kit/build/release
        run: ctest --output-on-failure --build-config Release

      - name: Install
        working-directory: imgui-platform-kit
        run: cmake --install build/release

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf imgui-platform-kit-${VERSION}-linux-x64.tar.gz -C . install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgui-platform-kit-linux
          path: imgui-platform-kit-*-linux-x64.tar.gz

  build-macos:
    name: Build and package (macOS)
    runs-on: macos-26

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect architecture and set triplet
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            echo "VCPKG_TRIPLET=arm64-osx" >> $GITHUB_ENV
            echo "MACOS_ARCH=arm64" >> $GITHUB_ENV
          else
            echo "VCPKG_TRIPLET=x64-osx" >> $GITHUB_ENV
            echo "MACOS_ARCH=x64" >> $GITHUB_ENV
          fi

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ env.VCPKG_TRIPLET }}

      - name: Configure CMake
        working-directory: imgui-platform-kit
        run: |
          cmake -S . -B build/release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build
        working-directory: imgui-platform-kit
        run: cmake --build build/release --config Release --parallel

      - name: Run tests
        working-directory: imgui-platform-kit/build/release
        run: ctest --output-on-failure --build-config Release

      - name: Install
        working-directory: imgui-platform-kit
        run: cmake --install build/release

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf imgui-platform-kit-${VERSION}-macos-${MACOS_ARCH}.tar.gz -C . install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgui-platform-kit-macos
          path: imgui-platform-kit-*-macos-*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "imgui-platform-kit $GITHUB_REF_NAME" \
            --generate-notes
