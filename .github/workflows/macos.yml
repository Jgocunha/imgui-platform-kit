name: macOS Build

on:
  push:
    branches: [ main, master, macOS ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-26

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect architecture and set triplet
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            echo "VCPKG_TRIPLET=arm64-osx" >> $GITHUB_ENV
          else
            echo "VCPKG_TRIPLET=x64-osx" >> $GITHUB_ENV
          fi

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ env.VCPKG_TRIPLET }}

      - name: Configure CMake
        working-directory: imgui-platform-kit
        run: |
          cmake -S . -B build/macos-ci \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build
        working-directory: imgui-platform-kit
        run: cmake --build build/macos-ci --config Release --parallel

      - name: Run tests
        working-directory: imgui-platform-kit/build/macos-ci
        run: ctest --output-on-failure --build-config Release
