name: Windows Build

on:
  push:
    branches: [ main, master, macOS ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-2025-vs2026

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize paths for bash
        shell: bash
        run: |
          echo "VCPKG_ROOT=$(echo "$VCPKG_ROOT" | tr '\\' '/')" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$(echo "$VCPKG_DEFAULT_BINARY_CACHE" | tr '\\' '/')" >> "$GITHUB_ENV"

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows

      - name: Configure CMake
        working-directory: imgui-platform-kit
        run: |
          cmake -S . -B build/windows-ci `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build
        working-directory: imgui-platform-kit
        run: cmake --build build/windows-ci --config Release --parallel

      - name: Run tests
        working-directory: imgui-platform-kit/build/windows-ci
        run: ctest --output-on-failure --build-config Release
